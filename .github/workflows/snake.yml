name: Generate Snake

on:
  schedule:
    - cron: "0 3 * * *" # roda todo dia às 03:00 UTC
  workflow_dispatch: # permite rodar manualmente pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: Thiizord
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#39FF14&color_dots=#161b22,#1a3a24,#235c33,#39FF14,#b9ffcf

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        if: success()
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
